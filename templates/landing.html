<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHer - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>
<body>

    <div class="landing-wrapper">
        <a href="/admin-auth" class="admin-gate">Admin</a>

        <h1 class="logo-text">ConnectHer</h1>

        <div class="button-group">
            <a href="/login" class="landing-btn">Log in</a>
            <a href="/register-page" class="landing-btn">Sign up</a>
        </div>
    </div>

    <script>
        function verifyAdmin(e) {
            e.preventDefault();
            
            // Set your desired password here
            const secretKey = "her-admin-2026"; 
            const userInput = prompt("Please enter the admin access code:");

            if (userInput === secretKey) {
                // Redirects to your admin route if correct
                window.location.href = "/admin-login";
            } else if (userInput !== null) {
                // Only alerts if they actually typed something and hit OK
                alert("Access Denied: Incorrect Code.");
            }
        }
    </script>
</body>
</html>
