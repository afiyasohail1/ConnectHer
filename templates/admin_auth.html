<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHer - Admin Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F5E5FF;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .auth-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(139, 95, 160, 0.1);
            width: 350px;
        }

        .logo-text {
            font-family: "Bitcount Prop Double Ink", system-ui;
            font-size: 32px;
            color: #8B5FA0;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .key-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #F5E5FF;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-size: 1.1rem;
            color: #8B5FA0;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .key-input:focus { border-color: #A680B8; }
        
        /* shake animation for wrong password */
        .key-input.shake {
            border-color: #c0392b;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-8px); }
            75%       { transform: translateX(8px); }
        }

        .error-box {
            display: none;
            margin-top: 15px;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6c6;
            border-left: 4px solid #c0392b;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.85rem;
            text-align: left;
        }

        .error-box.visible { display: block; }

        .submit-btn {
            margin-top: 20px;
            background-color: #A680B8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        .submit-btn:hover { background-color: #8B5FA0; }

        .back-link {
            display: block;
            margin-top: 15px;
            color: #A680B8;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 class="logo-text">Admin Portal</h2>
        <p>Please enter the restricted access key to continue.</p>
        
        <input type="password" id="adminKey" class="key-input" placeholder="••••••••">
        
        <!-- Error box replaces alert() -->
        <div class="error-box" id="errorBox">
            ❌ Invalid key. Access denied. Please try again.
        </div>

        <button onclick="checkKey()" class="submit-btn">Unlock Access</button>
        <a href="/" class="back-link">Return</a>
    </div>

    <script>
        function checkKey() {
            const key = document.getElementById('adminKey').value;
            const secret = "her-admin-2026";
            const input = document.getElementById('adminKey');
            const errorBox = document.getElementById('errorBox');

            if (key === secret) {
                window.location.href = "/admin-dashboard";
            } else {
                // Show error box
                errorBox.classList.add('visible');
                
                // Shake the input and turn it red
                input.classList.remove('shake');
                void input.offsetWidth; // force reflow so animation restarts
                input.classList.add('shake');
                input.value = "";

                // Hide error box after 4 seconds
                setTimeout(() => errorBox.classList.remove('visible'), 4000);
            }
        }

        document.getElementById("adminKey").addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkKey();
        });

        // Hide error box when user starts typing again
        document.getElementById("adminKey").addEventListener("input", function() {
            document.getElementById('errorBox').classList.remove('visible');
            this.classList.remove('shake');
        });
    </script>
</body>
</html>
